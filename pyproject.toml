[project]
name = "llm-eval-pipeline"
version = "0.1.0"
description = "Regression-gated evaluation harness for Claude-powered features"
requires-python = ">=3.11"
dependencies = [
    "anthropic>=1.0.0",
    "pydantic>=2.7",
    "pyyaml>=6.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-cov>=5.0",
]

[project.scripts]
evals = "evals.cli:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["evals*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
